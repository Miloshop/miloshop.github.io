<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda de Ropa</title>

<style>
body{
font-family: Arial;
margin:0;
background:#f4f4f4;
}

header{
background:black;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#333;
padding:10px;
text-align:center;
}

nav a{
color:white;
margin:10px;
text-decoration:none;
font-weight:bold;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}

.product{
background:white;
width:250px;
margin:15px;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.product img{
width:100%;
border-radius:10px;
}

.price{
color:green;
font-size:20px;
font-weight:bold;
}

button{
background:black;
color:white;
border:none;
padding:10px 15px;
margin-top:10px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#444;
}

footer{
background:black;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>Mi Tienda de Ropa 👕</h1>
<p>Moda moderna y económica</p>
</header>

<nav>
<a href="#">Inicio</a>
<a href="#">Productos</a>
<a href="#">Contacto</a>
</nav>

<section class="container">

<div class="product">
<img src="https://via.placeholder.com/250" alt="Camiseta">
<h3>Camiseta Casual</h3>
<p class="price">$20</p>
<button>Comprar</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/250" alt="Sudadera">
<h3>Sudadera</h3>
<p class="price">$35</p>
<button>Comprar</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/250" alt="Chaqueta">
<h3>Chaqueta</h3>
<p class="price">$50</p>
<button>Comprar</button>
</div>

</section>

<footer>
<p>© 2026 Mi Tienda de Ropa</p>
</footer>

</body>
</html>
